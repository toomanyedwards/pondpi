[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pondpi"
version = "0.1.0"
description = "Measures pond water level with an A02YYUW ultrasonic sensor and exposes it over HTTP."
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "flask",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pondpi-server = "pondpi.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
