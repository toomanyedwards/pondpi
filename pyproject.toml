[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pondpi"
version = "0.1.0"
description = "Measures pond water level with an A02YYUW ultrasonic sensor and exposes it over HTTP."
requires-python = ">=3.9"
dependencies = [
    "pyserial",
    "flask",
    "pyyaml",
    "gpiozero",
    # Linux-only (its build needs linux/spi/spidev.h, which doesn't
    # exist on macOS/Windows) -- only needed on the real Pi. Only ever
    # imported from etape_sensor/__init__.py's create(), deferred inside
    # its non-simulate branch, so its absence in a non-Linux dev venv
    # never breaks importing the package or running the test suite.
    "spidev; sys_platform == 'linux'",
    # gpiozero (above) needs a real pin factory backend to do anything
    # beyond plain digital output -- an *input* device (DigitalInputDevice,
    # only used by etape_sensor's DRDY pin; every existing GPIO use before
    # it was output-only and never hit this) configures edge-detection at
    # construction time regardless of whether the caller ever uses it,
    # which needs a working backend to succeed at all. Without one
    # installed, gpiozero silently falls back to its own legacy
    # NativeFactory (sysfs GPIO), which errors outright on this Pi's
    # current kernel (OSError: [Errno 22] Invalid argument on pin
    # export) -- confirmed the hard way in production (see PR history).
    # lgpio is the modern backend for the gpiochip character-device
    # interface Raspberry Pi OS Bookworm+ uses. Linux-only, same as
    # spidev above -- its C extension needs liblgpio-dev's headers to
    # build, which isn't available off Linux either.
    "lgpio; sys_platform == 'linux'",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
pondpi-server = "pondpi.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
src = ["src"]
