name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Staging smoke test
        run: |
          python3 -m venv --clear /opt/pondpi-staging-venv
          /opt/pondpi-staging-venv/bin/pip install --quiet -r requirements.txt -r requirements-dev.txt
          /opt/pondpi-staging-venv/bin/python -m py_compile read_sensor.py
          /opt/pondpi-staging-venv/bin/pytest -q

      - name: Sync files to deploy directory
        run: |
          mkdir -p /opt/pondpi
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'deploy' --exclude '.venv' ./ /opt/pondpi/

      - name: Install dependencies
        run: /opt/pondpi/.venv/bin/pip install -r /opt/pondpi/requirements.txt

      - name: Restart service
        run: sudo systemctl restart pondpi.service

      - name: Notify on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: toomanyedwards@gmail.com
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "PondPi deploy failed (run #${{ github.run_number }})"
          to: toomanyedwards@gmail.com
          from: PondPi CI <toomanyedwards@gmail.com>
          body: |
            Deploy failed on commit ${{ github.sha }}.

            Logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
