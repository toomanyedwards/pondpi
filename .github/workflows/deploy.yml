name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Staging smoke test
        run: |
          python3 -m venv --clear /opt/pondpi-staging-venv
          /opt/pondpi-staging-venv/bin/pip install --quiet --upgrade pip
          /opt/pondpi-staging-venv/bin/pip install --quiet -e ".[dev]"
          find src/pondpi -name '*.py' | xargs /opt/pondpi-staging-venv/bin/python -m py_compile
          /opt/pondpi-staging-venv/bin/python -m pytest -q

      - name: Record commit SHA
        run: echo "${{ github.sha }}" > COMMIT_SHA

      - name: Sync files to deploy directory
        run: |
          mkdir -p /opt/pondpi
          rsync -a --delete --exclude '.git' --exclude '.github' --exclude 'deploy' --exclude '.venv' ./ /opt/pondpi/

      - name: Install dependencies
        run: |
          /opt/pondpi/.venv/bin/pip install --quiet --upgrade pip
          /opt/pondpi/.venv/bin/pip install -e /opt/pondpi

      - name: Update systemd unit
        run: |
          sudo cp deploy/pondpi.service /etc/systemd/system/pondpi.service
          sudo systemctl daemon-reload

      - name: Restart service
        run: sudo systemctl restart pondpi.service
