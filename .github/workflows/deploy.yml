name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: [self-hosted]
    steps:
      - uses: actions/checkout@v4

      - name: Sync files to deploy directory
        run: |
          mkdir -p /opt/pondpi
          rsync -a --delete --exclude '.git' --exclude '.github' ./ /opt/pondpi/

      - name: Install dependencies
        run: /opt/pondpi/.venv/bin/pip install -r /opt/pondpi/requirements.txt

      - name: Restart service
        run: sudo systemctl restart pondpi.service
