# Named sensor instances, each built by the driver `type`'s create()
# function in src/pondpi/sensors/. A type name is just its file's
# filename with the "_sensor" suffix stripped (e.g.
# sensors/a02yyuw_sensor.py -> type: a02yyuw), discovered dynamically at
# startup -- adding a new sensor type means writing
# sensors/<name>_sensor.py, not editing anything here or in code.
#
# Exactly one sensor must be marked `default: true`. server.py's bare
# routes (/level, /diag, POST /reset -- i.e. not under /sensors/<name>/)
# operate on that one, so a single-sensor deployment's existing
# integrations (e.g. Home Assistant's REST sensors, configured against
# these exact bare routes) keep working unchanged as more sensors are
# added. Every sensor, default or not, is also reachable at
# /sensors/<name>/level and /sensors/<name>/diag.
sensors:
  - name: pond_main
    type: a02yyuw
    default: true
    params:
      serial_port: /dev/serial0
      mode_select_pin: 25
      power_pin: 24

# Named, parameterized instances of the LevelSignal classes in
# src/pondpi/signals/. See README.md's "Signal processing" section for
# this schema in full (params.sensor, params.unit, params.mode, input:,
# emit: false, primary: true).
#
# Only a `type: sensor` signal reads directly from a sensor, via
# params.sensor naming it -- it must also declare params.unit (the
# unit its readings are in, e.g. "cm"), since nothing upstream can tell
# us that. It may also set params.mode ("raw", the default, or
# "processed") to pick which of the sensor's two hardware readings
# feeds it -- see README.md's "RX pin" section for what those mean for
# the A02YYUW. Every other signal reads another signal's live output
# instead, named by `input:` -- this is how sequential composition
# (e.g. median-then-average) is expressed, without a dedicated "chain"
# type -- and derives its own unit/mode from that input automatically.
#
# polling_rolling_average is a normal input:-composed type like any
# other, with one difference: it owns its own dedicated background
# thread (see server.py's main()) that samples its input's current
# value on its own poll_interval_s cadence, rather than being pushed a
# new one on every one of the sensor's own (much faster) poll ticks --
# that's what lets window_size * poll_interval_s be a genuine
# real-world time span. Exactly one signal per sensor -- this one --
# must be marked primary; see LevelSignal.owns_read_loop.
signals:
  - name: pond_main_sensor_raw
    type: sensor
    params:
      sensor: pond_main
      unit: cm
  - name: pond_main_sensor_processed
    type: sensor
    params:
      sensor: pond_main
      unit: cm
      mode: processed
  - name: rolling_median5
    type: rolling_median
    input: pond_main_sensor_raw
    emit: false
    params:
      window_size: 5
  - name: polling_rolling_avg
    type: polling_rolling_average
    input: rolling_median5
    primary: true
    params:
      # Its own dedicated thread admits one sample per poll_interval_s
      # regardless of how often the sensor itself is actually polled,
      # so window_size * poll_interval_s (60 * 1s = 60s) is the real
      # time span this averages over -- matched to Home Assistant's
      # scan_interval so primary_signal represents a full averaged
      # interval per HA poll rather than a ~6s slice of it.
      window_size: 60
      poll_interval_s: 1
