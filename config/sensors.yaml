# ==============================================================================
# PHYSICAL SENSOR INSTANCES
# Generic fields: name, type
# Implementation fields: nested under 'settings'
#
# Each sensor instance is built by the driver `type`'s create() function
# in src/pondpi/sensors/. A type name is just its file's filename with
# the "_sensor" suffix stripped (e.g. sensors/a02yyuw_sensor.py -> type:
# a02yyuw), discovered dynamically at startup -- adding a new sensor
# type means writing sensors/<name>_sensor.py, not editing anything here
# or in code.
#
# GET /diag and POST /reset (bare, not under /sensors/<name>/) span every
# sensor configured here at once. Every sensor is also reachable
# individually at /sensors/<name>/diag and /sensors/<name>/reset.
# ==============================================================================
sensors:
  - name: pond_main
    type: a02yyuw
    settings:
      serial_port: /dev/serial0
      mode_select_pin: 25
      power_pin: 24

# ==============================================================================
# SIGNAL PROCESSING CHAINS
# Generic fields: name, type, source, emit
# Implementation fields: nested under 'settings'
#
# See README.md's "Signal processing" section for this schema in full.
# Every signal names where its data comes from via a top-level `source:`
# mapping -- `source.name` is required and, for a `type: sensor` signal,
# is the sensor it reads from directly; for every other type it's
# another signal (defined earlier in this file) whose live output feeds
# it. This is how sequential composition (e.g. median-then-average) is
# expressed, without a dedicated "chain" type. A `type: sensor` signal
# must also set `unit` in its `settings:` (the unit its readings are in,
# e.g. "cm"), and may set `source.options.read_mode` too ("raw", the
# default, or "processed") to pick which of the sensor's two hardware
# readings feeds it -- see README.md's "RX pin" section for what those
# mean for the A02YYUW. Every other signal derives its own unit/mode
# from `source:` automatically, and must leave `source.options` unset.
# `settings:` otherwise holds whatever else a signal type's own
# constructor needs (e.g. rolling_average's window_size below).
#
# rolling_average is a normal source:-composed type like any other,
# with one difference: it owns its own dedicated background thread
# that samples its source's current value on its own poll_interval_ms
# cadence, rather than recomputing lazily every time something reads
# it (the default every other signal type uses) -- that's what lets
# window_size * poll_interval_ms be a genuine real-world time span
# regardless of how often anything actually polls this signal. Owning
# a background thread like this is purely a property of a signal
# type's own implementation, not something marked in this file.
# ==============================================================================
signals:
  - name: pond_main_sensor_raw
    type: sensor
    source:
      name: pond_main
    settings:
      unit: cm
  - name: pond_main_sensor_processed
    type: sensor
    source:
      name: pond_main
      options:
        read_mode: processed
    settings:
      unit: cm
  - name: rolling_median5
    type: rolling_median
    source:
      name: pond_main_sensor_raw
    emit: false
    settings:
      window_size: 5
  - name: rolling_avg
    type: rolling_average
    source:
      name: rolling_median5
    settings:
      # Its own dedicated thread admits one sample per poll_interval_ms
      # regardless of how often the sensor itself is actually polled,
      # so window_size * poll_interval_ms (60 * 1000ms = 60s) is the
      # real time span this averages over -- matched to Home
      # Assistant's scan_interval so rolling_avg represents a full
      # averaged interval per HA poll rather than a ~6s slice of it.
      window_size: 60
      poll_interval_ms: 1000
