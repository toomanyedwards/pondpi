# ==============================================================================
# PHYSICAL SENSOR INSTANCES
# Generic fields: name, type
# Implementation fields: nested under 'settings'
#
# Each sensor instance is built by the driver `type`'s create() function
# in src/pondpi/sensors/. A type name is just its file's filename with
# the "_sensor" suffix stripped (e.g. sensors/a02yyuw_sensor.py -> type:
# a02yyuw), discovered dynamically at startup -- adding a new sensor
# type means writing sensors/<name>_sensor.py, not editing anything here
# or in code.
#
# GET /diag and POST /reset (bare, not under /sensors/<name>/) span every
# sensor configured here at once. Every sensor is also reachable
# individually at /sensors/<name>/diag and /sensors/<name>/reset.
# ==============================================================================
sensors:
  - name: pond_main
    type: a02yyuw
    settings:
      serial_port: /dev/serial0
      mode_select_pin: 25
      power_pin: 24

  - name: pond_secondary
    type: a02yyuw
    settings:
      serial_port: /dev/ttyAMA3
      mode_select_pin: 16
      power_pin: 6

  - name: pond_etape
    type: etape
    settings:
      adc_channel: 0
      # met5_1's own calibration (2026-09-27), fit against its actual
      # ADC voltage via EtapeSensor.extra_diag()'s last_voltage_v --
      # preliminary, only 3 points so far (depth_cm, voltage_v):
      # (5.0, 0.902), (6.096, 1.326), (7.112, 1.645), residuals under
      # 0.08cm. Narrower range and fewer points than the original
      # 6-point bench calibration -- worth widening with more points
      # later, especially near the low/high ends of met5_1's actual
      # working range. Superseded a placeholder value carried over from
      # a different, earlier-calibrated unit (see README's "Milone
      # eTape" section); also required fixing a miswired M12 extension
      # cable connector along the way (see memory/git history) --
      # readings before that fix are not valid and were discarded.
      # This is also the sensor's own voltage-to-*depth* fit (rises with
      # water level), the opposite sign from this project's canonical
      # distance-to-surface convention that pond_main/pond_secondary's
      # raw readings follow -- re-sign (in addition to re-calibrating)
      # before comparing pond_etape_sensor_raw directly against either.
      calibration_slope_cm_per_v: 2.829
      calibration_intercept_cm: 2.417

  - name: pond_etape_12
    type: etape
    settings:
      adc_channel: 1
      # met12_1's own calibration (2026-09-27), a 12" eTape wired on ADC
      # channel 1 ("a1"/IO1), sharing the same ADS1263 HAT as met5_1
      # above (see this driver's own _get_or_build_shared_adc() for why
      # that's safe now). Fit against 5 points via
      # EtapeSensor.extra_diag()'s last_voltage_v, depth_cm/voltage_v:
      # (7.874, 0.891), (17.018, 1.795), (23.622, 2.522), (25.908,
      # 2.722), (26.924, 2.809) -- least-squares over all 5 gave
      # residuals up to 0.31cm, with the 23.622cm point as the clear
      # outlier (+0.31cm). Refitting the other 4 (excluding that point)
      # tightened this to a 0.15cm max residual and was confirmed
      # against live readings as "spot on" -- that's the fit below, not
      # the full-5-point one. Only calibrated across 3.1-10.6in of this
      # tape's 12in range; the 10.6-12in top end is untested.
      calibration_slope_cm_per_v: 9.8727
      calibration_intercept_cm: -0.8519

# ==============================================================================
# SIGNAL PROCESSING CHAINS
# Generic fields: name, type, source, emit
# Implementation fields: nested under 'settings'
#
# See README.md's "Signal processing" section for this schema in full.
# Every signal names where its data comes from via a top-level `source:`
# -- a bare name (shorthand for {name: <name>}), or a mapping with a
# `name` and, optionally, `options`. `source.name` is required and, for
# a `type: sensor` signal, is the sensor it reads from directly; for
# every other type it's another signal (defined earlier in this file)
# whose live output feeds it. This is how sequential composition (e.g.
# median-then-average) is expressed, without a dedicated "chain" type. A
# `type: sensor` signal must also set `unit` in its `settings:` (the
# unit its readings are in, e.g. "cm"), and may set
# `source.options.read_mode` too ("raw", the default, or "processed") to
# pick which of the sensor's two hardware readings feeds it -- see
# README.md's "RX pin" section for what those mean for the A02YYUW.
# Every other signal derives its own unit/mode from `source:`
# automatically, and must leave `source.options` unset. `settings:`
# otherwise holds whatever else a signal type's own constructor needs
# (e.g. rolling_average's window_size below).
#
# rolling_average is a normal source:-composed type like any other,
# with one difference: it owns its own dedicated background thread
# that samples its source's current value on its own poll_interval_ms
# cadence, rather than recomputing lazily every time something reads
# it (the default every other signal type uses) -- that's what lets
# window_size * poll_interval_ms be a genuine real-world time span
# regardless of how often anything actually polls this signal. Owning
# a background thread like this is purely a property of a signal
# type's own implementation, not something marked in this file.
# ==============================================================================
signals:
  - name: pond_main_sensor_raw
    type: sensor
    source: pond_main
    settings:
      unit: cm
  - name: pond_main_sensor_processed
    type: sensor
    source:
      name: pond_main
      options:
        read_mode: processed
    settings:
      unit: cm
  - name: rolling_median5
    type: rolling_median
    source: pond_main_sensor_raw
    emit: false
    settings:
      window_size: 5
  - name: rolling_avg
    type: rolling_average
    source: rolling_median5
    settings:
      # Its own dedicated thread admits one sample per poll_interval_ms
      # regardless of how often the sensor itself is actually polled,
      # so window_size * poll_interval_ms (60 * 1000ms = 60s) is the
      # real time span this averages over -- matched to Home
      # Assistant's scan_interval so rolling_avg represents a full
      # averaged interval per HA poll rather than a ~6s slice of it.
      window_size: 60
      poll_interval_ms: 1000

  - name: pond_secondary_sensor_raw
    type: sensor
    source: pond_secondary
    settings:
      unit: cm
  - name: pond_secondary_sensor_processed
    type: sensor
    source:
      name: pond_secondary
      options:
        read_mode: processed
    settings:
      unit: cm
  - name: pond_secondary_rolling_median5
    type: rolling_median
    source: pond_secondary_sensor_raw
    emit: false
    settings:
      window_size: 5
  - name: pond_secondary_rolling_avg
    type: rolling_average
    source: pond_secondary_rolling_median5
    settings:
      window_size: 60
      poll_interval_ms: 1000

  - name: pond_etape_sensor_raw
    type: sensor
    source: pond_etape
    settings:
      unit: cm
  - name: pond_etape_rolling_median5
    type: rolling_median
    source: pond_etape_sensor_raw
    emit: false
    settings:
      window_size: 5
  - name: pond_etape_rolling_avg
    type: rolling_average
    source: pond_etape_rolling_median5
    settings:
      window_size: 60
      poll_interval_ms: 1000

  - name: pond_etape_12_sensor_raw
    type: sensor
    source: pond_etape_12
    settings:
      unit: cm
  - name: pond_etape_12_rolling_median5
    type: rolling_median
    source: pond_etape_12_sensor_raw
    emit: false
    settings:
      window_size: 5
  - name: pond_etape_12_rolling_avg
    type: rolling_average
    source: pond_etape_12_rolling_median5
    settings:
      window_size: 60
      poll_interval_ms: 1000
