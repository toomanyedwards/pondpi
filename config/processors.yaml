# Named, parameterized instances of the LevelSignalProcessor classes in
# src/pondpi/signal_processors/. Each processor's type name is just its
# filename with the "_processor" suffix stripped (e.g.
# signal_processors/rolling_median_processor.py -> type: rolling_median),
# discovered dynamically at startup -- adding a new processor means
# writing signal_processors/<name>_processor.py, not editing anything
# here or in code. Files not ending in "_processor" (base.py, the utils/
# subpackage, or any future non-processor helper module) are ignored
# automatically. Every instance below processes the raw sensor stream
# independently and its full state is exposed under `processors` in
# /diag. See README.md's "Signal processing" section.
#
# `emit: false` (default true) keeps a processor out of /level's
# `signals` section -- the curated "final output values" view -- while
# it still shows up in full on /diag. Use this for processors that only
# exist as an intermediate step (e.g. rolling_median5 below, which feeds
# rolling_avg's chain) and aren't a meaningful output on their own.
#
# `type: chain` runs a value through multiple processors in sequence via
# `params.steps`. Each step is either `ref: <name>` (reuses another
# processor's type/params, building its own fresh independent instance --
# never the literal same object, so state is never shared) or an inline
# `type`/`params` (builds a fresh instance directly, recursively).
#
# Exactly one entry must be marked `primary: true` -- its output becomes
# `primary_signal` in /level, which the Home Assistant "Pond Level" sensor
# depends on. Don't remove it without updating configuration.yaml on the
# Home Assistant box.
processors:
  - name: rolling_median5
    type: rolling_median
    emit: false
    params:
      window_size: 5
  - name: rolling_avg
    type: chain
    primary: true
    params:
      steps:
        - ref: rolling_median5
        - type: rolling_average
          params:
            window_size: 40
  # alpha is applied once per 150ms poll, not once per HA scrape -- at
  # that feed rate an EMA's half-life is roughly 0.15s * ln(0.5)/ln(1-alpha)
  # samples. alpha 0.1-0.9 all decay to a fraction of a second, which is
  # invisible next to Home Assistant's 30s scan_interval; alpha needs to
  # be in the ~0.01-0.2 range for the half-life to land in the 1-20s
  # range and actually show up as smoothing on a 30s-resolution chart.
  - name: exp_smooth_0p01
    type: exponential_smoothing
    params:
      alpha: 0.01
  - name: exp_smooth_0p02
    type: exponential_smoothing
    params:
      alpha: 0.02
  - name: exp_smooth_0p05
    type: exponential_smoothing
    params:
      alpha: 0.05
  - name: exp_smooth_0p1
    type: exponential_smoothing
    params:
      alpha: 0.1
  - name: exp_smooth_0p2
    type: exponential_smoothing
    params:
      alpha: 0.2
  - name: instantaneous_raw
    type: raw
