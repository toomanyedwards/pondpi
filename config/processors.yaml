# Named, parameterized instances of the LevelSignalProcessor classes in
# src/pondpi/signal_processors/. Each processor's type name is just its
# filename (e.g. signal_processors/median.py -> type: median), discovered
# dynamically at startup -- adding a new processor means writing
# signal_processors/<name>.py, not editing anything here or in code. Every
# instance below processes the raw sensor stream independently and its
# output is exposed under `processors` in /level. See README.md's
# "Signal processing" section.
#
# `type: chain` runs a value through multiple processors in sequence via
# `params.steps`. Each step is either `ref: <name>` (reuses another
# processor's type/params, building its own fresh independent instance --
# never the literal same object, so state is never shared) or an inline
# `type`/`params` (builds a fresh instance directly, recursively).
#
# Exactly one entry must be marked `primary: true` -- its output backfills
# the legacy top-level rolling_avg_distance_cm field in /level, which the
# Home Assistant "Pond Level" sensor depends on. Don't remove it without
# updating configuration.yaml on the Home Assistant box.
processors:
  - name: median5
    type: median
    params:
      window_size: 5
  - name: rolling_avg
    type: chain
    primary: true
    params:
      steps:
        - ref: median5
        - type: rolling_average
          params:
            window_size: 40
  - name: instantaneous_raw
    type: raw
