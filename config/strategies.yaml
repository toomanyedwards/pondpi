# Named, parameterized instances of the LevelStrategy classes in
# level_strategies.py. Every instance here processes the raw sensor
# stream independently and its output is exposed under `strategies` in
# /level. See README.md's "Signal processing strategies" section.
#
# Exactly one entry must be marked `primary: true` -- its output backfills
# the legacy top-level rolling_avg_distance_cm field in /level, which the
# Home Assistant "Pond Level" sensor depends on. Don't remove it without
# updating configuration.yaml on the Home Assistant box.
strategies:
  - name: rolling_avg
    type: median_then_rolling_average
    primary: true
    params:
      median_window_size: 5
      rolling_window_size: 40
  - name: instantaneous_raw
    type: raw
